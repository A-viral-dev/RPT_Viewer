[project]
name = "rpt-viewer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "clevercsv>=0.8.4",
    "fpdf2>=2.8.7",
    "nicegui>=3.9.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pyinstaller>=6.19.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
